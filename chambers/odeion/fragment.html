<div class="fixed vh-100 w-100 overflow-y-auto">
  <div class="absolute top-1 left-1 z-5">
    <a href="#south-wing" class="white-link f-2_250rem-ns link">&#8629;</a>
  </div>
  <div class="tc pt5 pb4">
    <h2 class="f2 f-headline-ns tracked-mega mb3 living-text" style="color: #ffd700">ODEION</h2>
    <p class="bodoni f4 o-70 mw6 center ph4 drifting-text">Albums, singles, demos, experimental</p>
  </div>
  <div class="mw9 center ph4 pb5 breathing">
    <!-- Audio Player Container -->
    <div id="odeion-player-container" class="mb4 pa3 ba b--white-20 br3 bg-black-70">
      <div id="odeion-now-playing" class="tc mb3">
        <p class="f6 o-50 mt0 mb1">Now Playing</p>
        <p id="odeion-track-title" class="f4 mt0 mb2" style="color: #ffd700">Select a track</p>
      </div>
      <canvas id="odeion-waveform" class="w-100 db" height="80" aria-label="Audio waveform visualization"></canvas>
      <div id="odeion-controls" class="flex justify-center items-center mt3">
        <button
          id="odeion-play-btn"
          class="pa2 ph3 ba b--white-30 bg-black-70 white f7 pointer br2 mr2"
          aria-label="Play/Pause"
        >
          &#9654; Play
        </button>
        <input id="odeion-volume" type="range" min="0" max="100" value="80" class="mr2" aria-label="Volume" />
      </div>
    </div>
    <!-- Section Navigation -->
    <div class="flex flex-wrap justify-center mb4" role="group" aria-label="Section navigation">
      <button class="section-btn active pa2 ph3 ma1 ba b--white-30 bg-black-70 white f7 pointer br2" data-section="all">
        All
      </button>
      <button class="section-btn pa2 ph3 ma1 ba b--white-30 bg-black-70 white f7 pointer br2" data-section="album">
        Albums
      </button>
      <button class="section-btn pa2 ph3 ma1 ba b--white-30 bg-black-70 white f7 pointer br2" data-section="single">
        Singles
      </button>
      <button class="section-btn pa2 ph3 ma1 ba b--white-30 bg-black-70 white f7 pointer br2" data-section="demo">
        Demos
      </button>
      <button
        class="section-btn pa2 ph3 ma1 ba b--white-30 bg-black-70 white f7 pointer br2"
        data-section="experimental"
      >
        Experimental
      </button>
    </div>
    <!-- PlaylistManager renders the verified album grid and track sources. -->
  </div>
</div>
